# Replace only Shield's table in one transaction; preserve Docker/Tailscale rules.
# Adding an existing table is a no-op, so the delete also works on first load.
add table inet shield_filter
delete table inet shield_filter

define CF_ADDR_IPV4 = {
        173.245.48.0/20,
        103.21.244.0/22,
        103.22.200.0/22,
        103.31.4.0/22,
        141.101.64.0/18,
        108.162.192.0/18,
        190.93.240.0/20,
        188.114.96.0/20,
        197.234.240.0/22,
        198.41.128.0/17,
        162.158.0.0/15,
        104.16.0.0/13,
        104.24.0.0/14,
        172.64.0.0/13,
        131.0.72.0/22
}

define CF_ADDR_IPV6 = {
        2400:cb00::/32,
        2606:4700::/32,
        2803:f800::/32,
        2405:b500::/32,
        2405:8100::/32,
        2a06:98c0::/29,
        2c0f:f248::/32
}

table inet shield_filter {
        chain input {
                type filter hook input priority 0; policy drop;
                ct state invalid counter drop
                ct state {established, related} counter accept
                meta iifname "lo" accept
                meta iifname != "lo" ip daddr 127.0.0.1/8 counter drop
                meta iifname != "lo" ip6 daddr ::1/128 counter drop
                ip protocol icmp counter accept
                meta l4proto ipv6-icmp counter accept
                tcp dport 12345 counter accept comment "accept SSH"
                udp dport 41641 counter accept comment "accept Tailscale direct connections"
                meta iifname "tailscale0" accept
                # Docker bridges -> host-published Sakura API (not public).
                iifname "br-*" ip daddr 172.17.0.1 tcp dport 30001 counter accept
                counter
        }
        chain forward {
                type filter hook forward priority -10; policy accept;
                ct state invalid counter drop
                ct state {established, related} counter accept
                iifname "tailscale0" counter accept
                iifname "docker0" counter accept
                iifname "br-*" counter accept
                # Require Cloudflare's source address and the original published host port.
                ip saddr $CF_ADDR_IPV4 meta l4proto tcp ct status dnat ct original proto-dst 443 counter accept
                ip6 saddr $CF_ADDR_IPV6 meta l4proto tcp ct status dnat ct original proto-dst 443 counter accept
                oifname "docker0" counter drop
                oifname "br-*" counter drop
        }
}
